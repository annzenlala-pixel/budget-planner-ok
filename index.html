<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每月財務預算自動化規劃書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
.box{border:3px solid var(--ink);border-radius:24px;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:3px solid var(--ink);padding:10px 12px;display:flex;align-items:center;gap:8px}
nav{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;justify-content:flex-start}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:4px 14px;background:var(--yellow);font-size:15px;white-space:nowrap}
nav a:nth-child(2){background:var(--coral)}nav a:nth-child(3){background:var(--sky)}nav a:nth-child(4){background:var(--green)}
nav a:active{transform:scale(.94)}
main{max-width:980px;margin:0 auto;padding:16px 14px 48px}
section{margin-top:36px}
h1{font-size:clamp(28px,8vw,48px);margin:8px 0;line-height:1.25}
h2{font-size:24px;margin:0 0 14px;display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:24px;padding:2px 18px}
.hero{background:var(--sky);padding:22px 16px;text-align:center;position:relative;overflow:hidden}
.hero .art{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap}
.hero svg{width:min(30%,170px);height:auto}
.count{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:8px 20px;margin-top:10px}
.count b{font-size:40px;color:#d9695a}
.metrics{display:grid;gap:14px;grid-template-columns:1fr}
.metric{padding:18px;text-align:center}
.metric small{display:block;font-size:14px}
.metric strong{font-size:32px;display:block}
.m1{background:var(--green)}.m2{background:var(--coral)}.m3{background:var(--yellow)}
.switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.switch button{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:12px 4px;font-size:17px;cursor:pointer;background:var(--paper)}
.switch button[aria-selected=true]{transform:translateY(3px);box-shadow:none}
.switch button{box-shadow:0 5px 0 var(--ink)}
.switch button[data-k=red][aria-selected=true]{background:var(--coral)}
.switch button[data-k=yellow][aria-selected=true]{background:var(--yellow)}
.switch button[data-k=green][aria-selected=true]{background:var(--green)}
.panel{margin-top:18px;padding:16px}
.panel.bounce{animation:bounce .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(.85) translateY(24px);opacity:.3}60%{transform:scale(1.04) translateY(-6px);opacity:1}100%{transform:none}}
.cond{font-size:18px;margin:0 0 12px}
.tl{list-style:none;margin:0;padding:0 0 0 30px;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;border-left:3px dashed var(--ink)}
.tl li{position:relative;margin-bottom:14px;padding:10px 12px;border:3px solid var(--ink);border-radius:24px}
.tl li::before{content:attr(data-n);position:absolute;left:-30px;top:10px;width:24px;height:24px;border:3px solid var(--ink);border-radius:50%;background:var(--c,var(--yellow));font-size:12px;text-align:center;line-height:18px}
.tl h3{margin:0;font-size:17px}
.tl p{margin:2px 0 0;font-size:15px}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:24px;padding:0 10px;font-size:13px;margin:2px 4px 2px 0}
.t-fix{background:var(--sky)}.t-food{background:var(--green)}.t-flex{background:var(--yellow)}.t-save{background:var(--coral)}
.must{background:var(--ink);color:var(--paper)}.ok{background:var(--green)}.t-day{background:var(--coral)}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:separate;border-spacing:0;border:3px solid var(--ink);border-radius:24px;overflow:hidden;min-width:420px}
th,td{padding:8px 12px;text-align:left;border-bottom:2px solid var(--ink);font-size:15px}
th{background:var(--yellow)}tr:last-child td{border-bottom:0}
.dash{border-style:dashed}.dash th,.dash td{border-bottom:2px dashed var(--ink)}
.todo{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.todo label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:3px solid var(--ink);border-radius:24px;cursor:pointer;background:var(--paper)}
.todo input{position:absolute;opacity:0}
.cb{flex:0 0 28px;height:28px;border:3px solid var(--ink);border-radius:10px 14px 10px 14px;position:relative;background:var(--paper)}
.cb::after{content:"";position:absolute;left:6px;top:0;width:8px;height:15px;border:solid var(--ink);border-width:0 4px 4px 0;transform:rotate(45deg) scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
input:checked+.cb{background:var(--green)}
input:checked+.cb::after{transform:rotate(45deg) scale(1)}
input:focus-visible+.cb{outline:3px solid var(--coral);outline-offset:2px}
.txt{background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 55%/0 3px;transition:background-size .5s ease,opacity .5s}
input:checked~.txt{background-size:100% 3px;opacity:.55}
.prog{height:22px;border:3px solid var(--ink);border-radius:24px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;width:60%;background:var(--sky);border-right:3px solid var(--ink)}
footer{text-align:center;font-size:14px;margin-top:40px}
.calc{padding:16px;display:grid;gap:12px;background:var(--sky)}.screen{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:8px 14px;text-align:right;font-size:28px;min-height:52px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys i{height:22px;border:3px solid var(--ink);border-radius:10px;background:var(--paper)}.calc input{font:inherit;width:100%;border:3px solid var(--ink);border-radius:24px;padding:10px 16px;background:var(--paper);color:var(--ink);font-size:18px}.calc input:focus-visible,.go:focus-visible,.switch button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}.go{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:10px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);cursor:pointer;font-size:18px}.go:active{transform:translateY(4px);box-shadow:none}.result{margin:0;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:10px 14px}.glow{animation:glow 1.4s ease-out}@keyframes glow{0%{box-shadow:0 0 0 0 var(--gc)}40%{box-shadow:0 0 0 14px var(--gc)}100%{box-shadow:0 0 0 0 transparent}}
.tl li.pop{animation:bounce .6s cubic-bezier(.3,1.6,.5,1) both}.num{color:#c4584a}.vault{display:grid;gap:10px;margin-bottom:14px}.vault input{font:inherit;width:100%;border:3px solid var(--ink);border-radius:24px;padding:10px 16px;background:var(--paper);color:var(--ink);font-size:18px}.vault input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}.vault .prog{margin:0}.vault .prog i{transition:width .6s cubic-bezier(.3,1.6,.5,1)}
.float{animation:float 4s ease-in-out infinite}
.f2{animation-delay:-1.3s}.f3{animation:breathe 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes breathe{50%{transform:scale(1.06)}}
.wing{transform-origin:50% 100%;animation:flap 1.2s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(-12deg)}}
@media(min-width:700px){.metrics{grid-template-columns:repeat(3,1fr)}main{padding:24px}nav{justify-content:center}.hero{padding:32px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.fld{display:grid;gap:4px}.fld label{font-size:15px}.hint{font-size:13px;margin:0;opacity:.75}.row3{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}.inbox{margin-top:18px;background:var(--yellow)}.inbox details{border:3px dashed var(--ink);border-radius:20px;padding:8px 12px;background:var(--paper)}.inbox summary{cursor:pointer;font-size:17px}.inbox details>div{display:grid;gap:10px;margin-top:10px}.warn{margin:0;background:var(--coral);border:3px solid var(--ink);border-radius:24px;padding:8px 14px;display:none}.ghost{background:var(--paper)}

.lock{min-height:calc(100vh - 2px);display:flex;align-items:center;justify-content:center;padding:20px}
.lock .box{width:min(100%,420px);padding:28px 20px;text-align:center;background:var(--sky);display:grid;gap:12px}
.lock .ico{font-size:52px;line-height:1}.lock h1{font-size:clamp(22px,6vw,30px);margin:0}.lock p{margin:0}
.lock input{font:inherit;width:100%;border:3px solid var(--ink);border-radius:24px;padding:10px 16px;background:var(--paper);color:var(--ink);font-size:18px;text-align:center}
.lock input:focus-visible,.lock .go:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.lock .go{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:10px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);cursor:pointer;font-size:18px}.lock .go:active{transform:translateY(4px);box-shadow:none}
.lock .err{min-height:1.7em;background:var(--coral);border:3px solid var(--ink);border-radius:24px;padding:4px 12px;visibility:hidden}
.lock .err.on{visibility:visible}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="lock" id="lock"><div class="box">
<div class="ico" aria-hidden="true">🔒</div>
<h1>每月財務預算自動化規劃書</h1>
<p>請輸入密碼才能打開網頁</p>
<label for="pw" style="position:absolute;left:-9999px">密碼</label>
<input id="pw" type="password" autocomplete="current-password" placeholder="🔑 密碼" autofocus>
<button class="go" id="unlock" type="button">解鎖 ✨</button>
<p class="err" id="err" role="alert" aria-live="assertive"></p>
</div></div>
<div id="app"></div>

var g=function(i){return document.getElementById(i)};
var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
function fail(m){var e=g('err');e.textContent=m;e.className='err on';var b=g('lock').firstElementChild;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
async function open(){
 var pw=g('pw').value;if(!pw){fail('請先輸入密碼喔 🐿️');return}
 if(!(window.crypto&&crypto.subtle)){fail('此環境不支援解密，請改用 https 網址或本機瀏覽器開啟');return}
 var btn=g('unlock');btn.disabled=true;
 try{
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
  var P=JSON.parse(new TextDecoder().decode(buf));
  g('lock').remove();g('app').innerHTML=P.html;
  var s=document.createElement('script');s.textContent=P.js;document.body.appendChild(s);
 }catch(e){fail('密碼不正確，請再試一次 🐿️');g('pw').select()}
 btn.disabled=false}
g('unlock').addEventListener('click',open);
g('pw').addEventListener('keydown',function(e){if(e.key==='Enter')open()});
})();
